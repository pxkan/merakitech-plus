name: Feature request / Ønske
description: Suggest an improvement / Foreslå en forbedring
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem / behov
      description: What would you like to do that Meraki+ cannot do today?
    validations: {required: true}
  - type: textarea
    id: idea
    attributes:
      label: Idea / forslag
  - type: textarea
    id: stock
    attributes:
      label: How does the stock UI do it? / Hvordan gør stock-UI'et?
      description: New machine commands must be ones the stock UI also sends (see CONTRIBUTING.md).
