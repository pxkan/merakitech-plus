name: Feature request
description: Suggest an improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem / need
      description: What would you like to do that Meraki+ cannot do today?
    validations: {required: true}
  - type: textarea
    id: idea
    attributes:
      label: Idea / proposal
  - type: textarea
    id: stock
    attributes:
      label: How does the stock UI do it?
      description: New machine commands must be ones the stock UI also sends (see CONTRIBUTING.md).
